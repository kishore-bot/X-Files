[versions]
agp = "9.5.2"
kotlin = "2.4.21"
compile-sdk = "37"
sdk-minor-api = "2"
min-sdk = "30"
target-sdk = "37"
activity = "1.13.0"
compose-bom = "2026.11.01"

oxikt = "1.4.0"
ndk = "29.0.14206865"

lifecycle = "2.10.0"
coroutines = "1.11.0"

media3 = "1.11.1"

serialization = "1.11.0"
annotation = "1.11.0"
hilt = "2.60.1"
androidx-hilt = "1.4.0"
ksp = "2.3.14"
navigation3 = "1.2.2"
mlkit-text = "16.0.1"
core-ktx = "1.19.1"
camerax = "1.7.0"
# Glance pulls WorkManager 2.7.1, whose keep rules break under R8 full mode; 2.8+ fixed it.
work = "2.12.0"
exifinterface = "1.4.2"
glance = "1.2.0"
# Baseline Profile generation and startup benchmarks (:baselineprofile). The plugin shares the benchmark release train.
androidx-benchmark = "1.5.0"
androidx-profileinstaller = "1.4.1"
androidx-test-ext-junit = "1.3.0"
androidx-uiautomator = "2.4.1"
# Opt-in Firebase Crashlytics (xfiles.firebaseCrashReports=true). Plugin 3.0.8 and google-services 4.5.0 match EzFiles on AGP 9.
google-services = "4.6.0"
crashlytics-plugin = "3.0.8"
firebase-bom = "35.2.0"
# Android AppFunctions (Android 16+ assistants). Stable 1.0.0 on Google Maven; the service and KSP compiler ship together.
appfunctions = "1.0.0"

[libraries]
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkit-text" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
core-splashscreen = { module = "androidx.core:core-splashscreen", version = "1.2.0" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glance" }
navigation3-runtime ={ module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
hilt-viewmodel-compose ={ module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "androidx-hilt" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-decoder = { module = "androidx.media3:media3-decoder", version.ref = "media3" }
media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "androidx-profileinstaller" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidx-benchmark" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-uiautomator" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore" }
appfunctions-runtime = { module = "androidx.appfunctions:appfunctions", version.ref = "appfunctions" }
appfunctions-compiler = { module = "androidx.appfunctions:appfunctions-compiler", version.ref = "appfunctions" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
oxikt = { id = "dev.oxikt.gradle.plugin", version.ref = "oxikt" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlytics-plugin" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "androidx-benchmark" }
