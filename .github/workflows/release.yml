name: Release

# Push a version tag to build, sign and publish the APK:
#   git tag v1.0.0-beta.01 && git push origin v1.0.0-beta.01
# Pre-release tags (anything with "-", e.g. -beta.01) are published as GitHub pre-releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the v (e.g. 1.0.0-beta.01)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NDK_VERSION: "29.0.14206865"
  CMAKE_VERSION: "3.22.1"
  ANDROID_PLATFORM: "platforms;android-37.2"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then v="${{ inputs.version }}"; else v="${GITHUB_REF_NAME#v}"; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$' || { echo "Bad version: $v"; exit 1; }
          echo "name=$v" >> "$GITHUB_OUTPUT"
          case "$v" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Android SDK packages
        run: sdkmanager --install "$ANDROID_PLATFORM" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null

      # rust-toolchain.toml pins the toolchain and the Android targets; rustup installs them here.
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.XFILES_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "The XFILES_KEYSTORE_BASE64 secret is missing; refusing to publish an unsigned APK."; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "XFILES_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the release APK
        env:
          XFILES_KEYSTORE_PASSWORD: ${{ secrets.XFILES_KEYSTORE_PASSWORD }}
          XFILES_KEY_ALIAS: ${{ secrets.XFILES_KEY_ALIAS }}
          XFILES_KEY_PASSWORD: ${{ secrets.XFILES_KEY_PASSWORD }}
        run: |
          # llama.cpp's bindings need libclang (bindgen) and CMake; the NDK and SDK provide both.
          export LIBCLANG_PATH="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/lib"
          export PATH="$ANDROID_HOME/cmake/$CMAKE_VERSION/bin:$PATH"
          ./gradlew --no-configuration-cache :sharedLogic:testAndroidHostTest :androidApp:assembleProdRelease \
            -Pxfiles.version=${{ steps.version.outputs.name }}

      - name: Name and checksum the APK
        id: apk
        run: |
          src=$(ls androidApp/build/outputs/apk/prod/release/*.apk | head -1)
          out="Xfiles-${{ steps.version.outputs.name }}.apk"
          cp "$src" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Xfiles ${{ steps.version.outputs.name }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
