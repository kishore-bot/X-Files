name: Release

# Push a version tag to build, sign and publish the APK:
#   git tag v1.0.0-beta.01 && git push origin v1.0.0-beta.01
# Pre-release tags (anything with "-", e.g. -beta.01) are published as GitHub pre-releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the v (e.g. 1.0.0-beta.01)"
        required: true

permissions:
  contents: write
  packages: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NDK_VERSION: "29.0.14206865"
  CMAKE_VERSION: "3.22.1"
  # Not ANDROID_PLATFORM: llama.cpp's build script reads that name as an API level.
  SDK_PLATFORM_PACKAGE: "platforms;android-37.2"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Check out pinned LazyMatrix Maven files
        uses: actions/checkout@v7
        with:
          repository: kishore-bot/xfiles-maven
          ref: d8a5eae29b47000dca495ed9605c2f4405307d05
          path: .ci-maven
          ssh-key: ${{ secrets.LAZYMATRIX_MAVEN_SSH_KEY }}
          persist-credentials: false

      - name: Version from the tag
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          v="${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Invalid release version" >&2
            exit 1
          fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
          case "$v" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # The hosted Ubuntu image ships the Android SDK and command-line tools; only add what this build needs.
      - name: Android SDK packages
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdk" ] || sdk=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdk" --licenses > /dev/null || true
          "$sdk" --install "$SDK_PLATFORM_PACKAGE" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/ndk"
          # The image presets its default NDK in these variables; point every one at the pinned NDK.
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          {
            echo "ANDROID_NDK_HOME=$ndk"
            echo "ANDROID_NDK_ROOT=$ndk"
            echo "ANDROID_NDK=$ndk"
            echo "ANDROID_NDK_LATEST_HOME=$ndk"
            echo "NDK_HOME=$ndk"
          } >> "$GITHUB_ENV"

      # rust-toolchain.toml pins the toolchain and the Android targets; rustup installs them here.
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Verify offline passage retrieval
        working-directory: engine
        run: cargo test --locked -p document-search --release -- --nocapture

      - uses: gradle/actions/setup-gradle@v6

      - name: Build FFmpeg audio decoders
        run: bash scripts/build-ffmpeg.sh

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.XFILES_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "The XFILES_KEYSTORE_BASE64 secret is missing; refusing to publish an unsigned APK."; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "XFILES_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the release APK
        env:
          ORG_GRADLE_PROJECT_lazyMatrixLocalRepo: ${{ github.workspace }}/.ci-maven
          XFILES_KEYSTORE_PASSWORD: ${{ secrets.XFILES_KEYSTORE_PASSWORD }}
          XFILES_KEY_ALIAS: ${{ secrets.XFILES_KEY_ALIAS }}
          XFILES_KEY_PASSWORD: ${{ secrets.XFILES_KEY_PASSWORD }}
        run: |
          # llama.cpp's bindings need libclang (bindgen) and CMake; the NDK and SDK provide both.
          export LIBCLANG_PATH="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/lib"
          export PATH="$ANDROID_HOME/cmake/$CMAKE_VERSION/bin:$PATH"
          ./gradlew --no-configuration-cache :sharedLogic:testAndroidHostTest :androidApp:assembleProdRelease \
            -Pxfiles.version=${{ steps.version.outputs.name }}

      - name: Name and checksum the APK
        id: apk
        run: |
          src=$(ls androidApp/build/outputs/apk/prod/release/*.apk | head -1)
          entries=$(unzip -Z1 "$src")
          for abi in arm64-v8a x86_64; do
            for lib in libavcodec.so libavutil.so libswresample.so libffmpegJNI.so; do
              grep -Fxq "lib/$abi/$lib" <<< "$entries" || {
                echo "Missing $abi/$lib in the release APK" >&2
                exit 1
              }
            done
          done
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify "$src"
          out="Xfiles-${{ steps.version.outputs.name }}.apk"
          cp "$src" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Xfiles ${{ steps.version.outputs.name }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
