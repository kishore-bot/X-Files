[package]
name = "xfiles-mcp"
description = "Model Context Protocol server exposing the Xfiles document engine to desktop AI clients (host-only)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "xfiles-mcp"
path = "src/main.rs"

[dependencies]
document-core.workspace = true
document-parsers.workspace = true
document-glance.workspace = true
rmcp = { version = "3.11", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "time", "sync"] }
zeroize.workspace = true

[dev-dependencies]
tempfile = "3"
