[package]
name = "document-ffi"
description = "UniFFI facade over the Xfiles document engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# cdylib: libdocument_ffi.so for Android and the host library for JVM tests.
# staticlib: libdocument_ffi.a linked into the iOS framework via cinterop.
# lib: lets the Rust integration tests call the exported API directly.
crate-type = ["cdylib", "staticlib", "lib"]

[features]
fily-opencl = ["fily-inference/android-opencl"]

[dependencies]
fily-inference = { path = "../fily-inference" }
document-core.workspace = true
document-parsers.workspace = true
document-search.workspace = true
document-tidy.workspace = true
document-glance.workspace = true
document-imaging.workspace = true
uniffi.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
