[package]
name = "document-parsers"
description = "Statically registered format parsers for the EzFiles document engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
document-core.workspace = true
quick-xml.workspace = true
flate2.workspace = true
crc32fast.workspace = true
pulldown-cmark = { workspace = true, features = ["html"] }
aes.workspace = true
cbc.workspace = true
sha1.workspace = true
sha2.workspace = true
md-5.workspace = true
rc4.workspace = true
getrandom.workspace = true
zeroize.workspace = true
unicode-normalization = "0.1.26"
zune-jpeg.workspace = true
jpeg-encoder.workspace = true
zip = { version = "=9.8.2", default-features = false, features = ["aes-crypto", "deflate-flate2-zlib-rs"] }
tar = { version = "0.4", default-features = false }
sevenz-rust2 = { version = "=0.27.0", default-features = false, features = ["compress"] }

[dev-dependencies]
tempfile = "3"
